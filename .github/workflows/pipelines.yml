

name: Next.js Build pipeline

on:
  push:
    branches:
      - main
      - tibe/featured
  pull_request:
    branches:
      - main
      - tibe/featured

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

 
      - name: Install Dependencies
        run: npm ci

   
      - name: Lint Code
        run: npm run lint || echo "Lint issues found"

  
      - name: Check Code Formatting
        run: npm run format -- --check || echo "Formatting issues found"

  
      - name: Run Tests
        run: npm test || echo "No tests found"

      - name: Build Project
        run: npm run build

    
      - name: Node & NPM Versions
        run: |
          node -v
          npm -v